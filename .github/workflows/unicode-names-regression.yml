name: Unicode names regression

on:
  pull_request:
    paths:
      - "core/validators.py"
      - "core/logic.py"
      - "ui/review_helpers.py"
      - "tests/test_unicode_names.py"
      - ".github/workflows/unicode-names-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Unicode and adjacent smoke tests
        run: python -m unittest tests.test_unicode_names tests.test_core_smoke tests.test_goleiros_smoke
