name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-streamlit-awake.yml"

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: python -m pip install --disable-pip-version-check "selenium>=4.30,<5"

      - name: Open app and wake it if needed
        env:
          STREAMLIT_APP_URL: "https://sorteador-pelada.streamlit.app/"
        run: |
          python - <<'PY'
          import os
          import time

          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.support.ui import WebDriverWait

          url = os.environ["STREAMLIT_APP_URL"]

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1280,900")

          driver = webdriver.Chrome(options=options)

          try:
              print(f"Abrindo {url}")
              driver.get(url)

              wake_xpath = (
                  "//button[contains("
                  "translate(normalize-space(.), "
                  "'ABCDEFGHIJKLMNOPQRSTUVWXYZ', "
                  "'abcdefghijklmnopqrstuvwxyz'), "
                  "'get this app back up'"
                  ")]"
              )

              try:
                  wake_button = WebDriverWait(driver, 20).until(
                      EC.element_to_be_clickable((By.XPATH, wake_xpath))
                  )
              except TimeoutException:
                  wake_button = None

              if wake_button is not None:
                  print("Aplicativo estava hibernando; acionando o despertar.")
                  wake_button.click()
              else:
                  print("Aplicativo já estava ativo.")

              def app_pronto(d):
                  titulo = (d.title or "").lower()
                  pagina = (d.page_source or "").lower()
                  return (
                      "sorteador pelada pro" in titulo
                      or (
                          "sorteador pelada pro" in pagina
                          and "gone to sleep due to inactivity" not in pagina
                      )
                  )

              WebDriverWait(driver, 180).until(app_pronto)

              # Mantém uma sessão real do navegador por alguns segundos para que
              # o Streamlit registre tráfego de usuário, não apenas um HTTP GET.
              time.sleep(15)
              print("Sorteador Pelada PRO está ativo.")
          finally:
              driver.quit()
          PY
