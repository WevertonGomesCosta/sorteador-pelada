name: Streamlit compatibility regression

on:
  pull_request:
    paths:
      - "app.py"
      - "ui/components.py"
      - "ui/group_config_view.py"
      - "ui/review_view.py"
      - "requirements.txt"
      - "tests/test_streamlit_compat_smoke.py"
      - ".github/workflows/streamlit-compat-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install app dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q app.py core data state ui tests

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
